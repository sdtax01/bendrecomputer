<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admission Enquiry | Bendre Computer Typing Institute, Pune</title>
<meta name="description" content="Send an admission enquiry to Bendre Computer Typing Institute, Wadgaonsheri, Pune. We will contact you soon.">
<meta property="og:title" content="Admission Enquiry | Bendre Computer Typing Institute">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0b1f4b">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>
<main id="main">
  <section class="page-hero"><div class="container">
    <span class="eyebrow">Admissions</span><h1>Start your learning journey</h1>
    <p class="lead" style="margin-top:14px">Fill in the form and our team will contact you soon. Fields marked <span style="color:var(--err)">*</span> are required.</p>
  </div></section>
  <section class="section" style="padding-top:36px"><div class="container" style="max-width:820px">
    <div class="form-card" id="card">
      <form id="form" autocomplete="on">
        <div class="form-grid">
          <div class="field" data-f="student_name"><label for="student_name">Student Full Name <span class="req">*</span></label><input class="input" id="student_name" name="student_name" maxlength="100" autocomplete="name"><div class="err" role="alert"></div></div>
          <div class="field" data-f="guardian_name"><label for="guardian_name">Parent / Guardian Name <span class="req">*</span></label><input class="input" id="guardian_name" name="guardian_name" maxlength="100"><div class="err" role="alert"></div></div>
          <div class="field" data-f="mobile"><label for="mobile">Mobile Number <span class="req">*</span></label><input class="input" id="mobile" name="mobile" type="tel" inputmode="numeric" maxlength="16" placeholder="10-digit mobile number" autocomplete="tel"><div class="err" role="alert"></div></div>
          <div class="field" data-f="whatsapp"><label for="whatsapp">WhatsApp Number <small>(optional)</small></label><input class="input" id="whatsapp" name="whatsapp" type="tel" inputmode="numeric" maxlength="16"><div class="err" role="alert"></div></div>
          <div class="field" data-f="email"><label for="email">Email Address <small>(optional)</small></label><input class="input" id="email" name="email" type="email" maxlength="120" autocomplete="email"><div class="err" role="alert"></div></div>
          <div class="field" data-f="course_id"><label for="course_id">Course Interested In <span class="req">*</span></label><select class="input" id="course_id" name="course_id"><option value="">Select a course</option></select><div class="err" role="alert"></div></div>
          <div class="field" data-f="preferred_timing"><label for="preferred_timing">Preferred Batch / Timing</label><input class="input" id="preferred_timing" name="preferred_timing" maxlength="100" placeholder="e.g. Morning, Evening"></div>
          <div class="field" data-f="qualification"><label for="qualification">Educational Qualification</label>
            <select class="input" id="qualification" name="qualification"><option value="">Select</option><option>Below 10th</option><option>10th pass</option><option>12th pass</option><option>Diploma</option><option>Graduate</option><option>Post-graduate</option><option>Other</option></select></div>
          <div class="field full" data-f="message"><label for="message">Message / Additional Information</label><textarea class="input" id="message" name="message" rows="4" maxlength="1500"></textarea><div class="err" role="alert"></div></div>
          <div class="field full" data-f="consent"><label class="check"><input type="checkbox" name="consent" id="consent"><span>I agree to be contacted by Bendre Computer Typing Institute regarding this enquiry. <span class="req">*</span></span></label><div class="err" role="alert"></div></div>
          <div class="full"><button class="btn btn-primary" type="submit" style="width:100%">Submit Enquiry</button></div>
        </div>
      </form>
    </div>
  </div></section>
</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/forms.js"></script>
<script>
(async function () {
  const { sb, esc } = window.BCTI;
  const S = await window.BCTI.ready;
  const form = document.getElementById('form'), sel = document.getElementById('course_id');
  if (sb) {
    try {
      const { data } = await sb.from('courses').select('id,name,admission_open').eq('is_published', true).order('sort_order');
      (data || []).filter((c) => c.admission_open).forEach((c) => sel.insertAdjacentHTML('beforeend', `<option value="${esc(c.id)}">${esc(c.name)}</option>`));
      const pre = new URLSearchParams(location.search).get('course');
      if (pre) sel.value = pre;
    } catch (e) {}
  }
  window.BCTI.enquiryForm(form, {
    kind: 'admission',
    required: ['student_name', 'guardian_name', 'course_id'],
    onSuccess: (ref, v) => {
      const wa = window.BCTI.waLink(S.contact, `Hello, I submitted an admission enquiry. My reference number is ${ref}.`);
      document.getElementById('card').innerHTML = `
        <div class="success"><div class="tick" aria-hidden="true">✓</div>
          <h2>Enquiry received</h2>
          <p class="lead" style="margin:12px auto 0">Thank you for your interest in Bendre Computer Typing Institute! Your admission enquiry has been received. Our team will contact you soon.</p>
          <div class="refno">Reference: ${esc(ref)}</div>
          <p style="margin-top:22px"><a class="btn btn-ghost" href="${esc(wa)}" target="_blank" rel="noopener">Message us on WhatsApp</a>
          <a class="btn btn-primary" href="index.html">Back to Home</a></p></div>`;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  });
})();
</script>
</body>
</html>
