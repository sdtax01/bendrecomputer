<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://challenges.cloudflare.com 'sha256-oilmqtCIFEnKa+b88B0rU3JI+J/YAYwnwv/Rk9lcqgg=' 'sha256-m//vCsCHVSFq4iNElKv/b21hPXtl43aQ8Lv0tzgnWHE='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://challenges.cloudflare.com; frame-src https://www.google.com https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self' https://wa.me">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admission Enquiry | Bendre Computer Typing Institute, Pune</title>
<meta name="description" content="Send an admission enquiry to Bendre Computer Typing Institute, Wadgaonsheri, Pune. We will contact you soon.">
<meta property="og:title" content="Admission Enquiry | Bendre Computer Typing Institute">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0b1f4b">
<script>document.documentElement.classList.add('js');setTimeout(function(){if(!window.__motion)document.documentElement.classList.remove('js')},4000)</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>
<main id="main">
  <section class="page-hero"><div class="hero-bg" aria-hidden="true"></div><div class="container">
    <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><span aria-current="page" style="opacity:1;color:var(--navy)">Admissions</span></nav>
    <span class="eyebrow">Admissions</span>
    <h1 class="split-auto">Start your learning journey</h1>
    <p class="lead" data-reveal style="--d:300ms">Fill in the form and our team will contact you soon. Fields marked <span style="color:var(--err)">*</span> are required.</p>
  </div></section>
  <section class="section" style="padding-top:clamp(2rem,4vw,3.4rem)"><div class="container" style="max-width:56rem">
    <div class="form-card" id="card" data-reveal="scale">
      <form id="form" autocomplete="on">
        <div class="form-grid">
          <div class="field" data-f="student_name"><label for="student_name">Student Full Name <span class="req">*</span></label><input class="input" id="student_name" name="student_name" maxlength="100" autocomplete="name"><div class="err" role="alert"></div></div>
          <div class="field" data-f="guardian_name"><label for="guardian_name">Parent / Guardian Name <span class="req">*</span></label><input class="input" id="guardian_name" name="guardian_name" maxlength="100"><div class="err" role="alert"></div></div>
          <div class="field" data-f="mobile"><label for="mobile">Mobile Number <span class="req">*</span></label><input class="input" id="mobile" name="mobile" type="tel" inputmode="numeric" maxlength="16" placeholder="10-digit mobile number" autocomplete="tel"><div class="err" role="alert"></div></div>
          <div class="field" data-f="whatsapp"><label for="whatsapp">WhatsApp Number <small>(optional)</small></label><input class="input" id="whatsapp" name="whatsapp" type="tel" inputmode="numeric" maxlength="16"><div class="err" role="alert"></div></div>
          <div class="field" data-f="email"><label for="email">Email Address <span class="req">*</span> <small>(your student login ID)</small></label><input class="input" id="email" name="email" type="email" maxlength="120" autocomplete="email"><div class="err" role="alert"></div></div>
          <div class="field" data-f="dob"><label for="dob">Date of Birth <span class="req">*</span></label><input class="input" id="dob" name="dob" type="date" autocomplete="bday"><div class="err" role="alert"></div></div>
          <div class="field" data-f="course_id"><label for="course_id">Course Interested In <span class="req">*</span></label><select class="input" id="course_id" name="course_id"><option value="">Select a course</option></select><div class="err" role="alert"></div></div>
          <div class="field" data-f="preferred_timing"><label for="preferred_timing">Preferred Batch / Timing</label><input class="input" id="preferred_timing" name="preferred_timing" maxlength="100" placeholder="e.g. Morning, Evening"></div>
          <div class="field" data-f="qualification"><label for="qualification">Educational Qualification</label>
            <select class="input" id="qualification" name="qualification"><option value="">Select</option><option>Below 10th</option><option>10th pass</option><option>12th pass</option><option>Diploma</option><option>Graduate</option><option>Post-graduate</option><option>Other</option></select></div>
          <div class="field full" data-f="message"><label for="message">Message / Additional Information</label><textarea class="input" id="message" name="message" rows="4" maxlength="1500"></textarea><div class="err" role="alert"></div></div>
          <div class="field full" data-f="consent"><label class="check"><input type="checkbox" name="consent" id="consent"><span>I agree to be contacted by Bendre Computer Typing Institute regarding this enquiry. <span class="req">*</span></span></label><div class="err" role="alert"></div></div>
          <div class="full"><button class="btn btn-primary" type="submit" style="width:100%">Submit Enquiry</button></div>
        </div>
      </form>
    </div>
  </div></section>
</main>
<div id="site-footer"></div>
<script src="assets/js/vendor/supabase.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/motion.js"></script>
<script src="assets/js/forms.js"></script>
<script src="assets/js/branches-public.js"></script>
<script>
(async function () {
  const { sb, esc } = window.BCTI;
  const S = await window.BCTI.ready;
  const form = document.getElementById('form'), sel = document.getElementById('course_id');
  if (sb) {
    try {
      const { data } = await sb.from('courses').select('id,name,admission_open').eq('is_published', true).order('sort_order');
      (data || []).filter((c) => c.admission_open).forEach((c) => sel.insertAdjacentHTML('beforeend', `<option value="${esc(c.id)}">${esc(c.name)}</option>`));
      const pre = new URLSearchParams(location.search).get('course');
      if (pre) sel.value = pre;
    } catch (e) {}
  }
  window.BCTI.enquiryForm(form, {
    kind: 'admission',
    required: ['student_name', 'guardian_name', 'course_id', 'email', 'dob'],
    admission: true,
    onSuccess: (ref, v, reg) => {
      const wa = window.BCTI.waLink(S.contact, `Hello, I submitted an admission enquiry. My reference number is ${ref}.`);
      document.getElementById('card').innerHTML = `
        <div class="success"><div class="tick" aria-hidden="true">${window.BCTI.icon('check')}</div>
          <h2>Enquiry received</h2>
          <p class="lead" style="margin:.8rem auto 0">Thank you for your interest in Bendre Computer Typing Institute! Your admission enquiry has been received. Our team will contact you soon.</p>
          <div class="refno">Reference: ${esc(ref)}</div>
          ${reg ? `<div class="refno" style="margin-top:.8rem;border-color:var(--orange)">Your Registration No.: <b>${esc(reg)}</b></div><p style="margin:.8rem auto 0;max-width:34rem;font-size:.95rem;color:var(--muted)">Please note this number. Once the institute confirms your admission, your <b>student login</b> (login ID: ${esc(v.email)}) will be created and the password shared with you.</p>` : ''}
          <p style="margin-top:1.5rem;display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap"><a class="btn btn-ghost" href="${esc(wa)}" target="_blank" rel="noopener">Message us on WhatsApp</a>
          <a class="btn btn-primary" href="index.html">Back to Home</a></p></div>`;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  });
})();
</script>
</body>
</html>
