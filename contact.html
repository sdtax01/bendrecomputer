<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact Us | Bendre Computer Typing Institute, Wadgaonsheri Pune</title>
<meta name="description" content="Contact Bendre Computer Typing Institute, Near City Care Hospital, Kamalnagar Society, Wadgaonsheri, Pune 411014. Call 9689418627.">
<meta property="og:title" content="Contact | Bendre Computer Typing Institute">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0b1f4b">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>
<main id="main">
  <section class="page-hero"><div class="container">
    <span class="eyebrow">Contact Us</span><h1>We'd love to hear from you</h1>
    <p class="lead" style="margin-top:14px">Visit, call, or send a message — whichever is easiest.</p>
  </div></section>
  <section class="section" style="padding-top:36px"><div class="container">
    <div class="contact-grid">
      <div>
        <ul class="info-list" id="info"></ul>
        <p style="margin-top:22px;display:flex;gap:10px;flex-wrap:wrap">
          <a class="btn btn-primary" id="dir" target="_blank" rel="noopener" href="#">Get Directions</a>
          <a class="btn btn-ghost" id="call" href="#">Call Now</a>
        </p>
        <iframe class="map" id="map" title="Map showing Bendre Computer Typing Institute" loading="lazy" referrerpolicy="no-referrer-when-downgrade" style="margin-top:26px"></iframe>
      </div>
      <div class="form-card" id="card">
        <h2 style="font-size:1.5rem;margin-bottom:18px">Send us a message</h2>
        <form id="form">
          <div class="form-grid">
            <div class="field full" data-f="student_name"><label for="student_name">Your Name <span class="req">*</span></label><input class="input" id="student_name" name="student_name" maxlength="100" autocomplete="name"><div class="err" role="alert"></div></div>
            <div class="field" data-f="mobile"><label for="mobile">Mobile Number <span class="req">*</span></label><input class="input" id="mobile" name="mobile" type="tel" inputmode="numeric" maxlength="16" autocomplete="tel"><div class="err" role="alert"></div></div>
            <div class="field" data-f="email"><label for="email">Email <small>(optional)</small></label><input class="input" id="email" name="email" type="email" maxlength="120"><div class="err" role="alert"></div></div>
            <div class="field full" data-f="message"><label for="message">Message <span class="req">*</span></label><textarea class="input" id="message" name="message" rows="4" maxlength="1500"></textarea><div class="err" role="alert"></div></div>
            <div class="field full" data-f="consent"><label class="check"><input type="checkbox" name="consent" id="consent"><span>I agree to be contacted regarding this message. <span class="req">*</span></span></label><div class="err" role="alert"></div></div>
            <div class="full"><button class="btn btn-primary" type="submit" style="width:100%">Send Message</button></div>
          </div>
        </form>
      </div>
    </div>
  </div></section>
</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/forms.js"></script>
<script>
(async function () {
  const { esc } = window.BCTI;
  const S = await window.BCTI.ready; const c = S.contact;
  const q = encodeURIComponent(c.maps_query || c.address);
  document.getElementById('info').innerHTML = `
    <li><span class="icon" aria-hidden="true">🏫</span><div><b>${esc(c.institute_name)}</b></div></li>
    <li><span class="icon" aria-hidden="true">📍</span><div><b>Address</b><br>${esc(c.address)}</div></li>
    <li><span class="icon" aria-hidden="true">📞</span><div><b>Phone</b><br><a href="tel:${esc(c.phone)}">${esc(c.phone)}</a></div></li>
    <li><span class="icon" aria-hidden="true">💬</span><div><b>WhatsApp</b><br><a href="${esc(window.BCTI.waLink(c))}" target="_blank" rel="noopener">Chat on WhatsApp</a></div></li>
    ${c.email ? `<li><span class="icon" aria-hidden="true">✉️</span><div><b>Email</b><br><a href="mailto:${esc(c.email)}">${esc(c.email)}</a></div></li>` : ''}
    ${c.opening_hours ? `<li><span class="icon" aria-hidden="true">🕘</span><div><b>Opening hours</b><br>${esc(c.opening_hours).replace(/\n/g, '<br>')}</div></li>` : ''}`;
  document.getElementById('map').src = `https://www.google.com/maps?q=${q}&output=embed`;
  document.getElementById('dir').href = `https://www.google.com/maps/dir/?api=1&destination=${q}`;
  document.getElementById('call').href = `tel:${c.phone}`;

  window.BCTI.enquiryForm(document.getElementById('form'), {
    kind: 'contact',
    required: ['student_name', 'message'],
    onSuccess: (ref) => {
      document.getElementById('card').innerHTML = `<div class="success"><div class="tick" aria-hidden="true">✓</div><h2>Message sent</h2>
        <p class="lead" style="margin:12px auto 0">Thank you for contacting Bendre Computer Typing Institute. Our team will get back to you soon.</p>
        <div class="refno">Reference: ${esc(ref)}</div></div>`;
    }
  });
})();
</script>
</body>
</html>
